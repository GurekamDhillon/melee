# Console arithmetic policing (docs/rust-port/notes/semantics.md). Only `tools/rust-port/semantics_lint.py` turns
# disallowed_methods into an error, and only for the game files (its GAME scope minus semantics_allow.tsv); host code
# (renderer, net, host, tooling) may use the host versions.
disallowed-methods = [
  { path = "f32::mul_add", reason = "one rounding; Gekko fmadds is fma in f64 then frsp: use melee_core::fp::fmadds" },
  { path = "f64::mul_add", reason = "use melee_core::fp::fmadd (the Gekko double fmadd) so every fused site is explicit" },
  { path = "f32::sqrt", reason = "host sqrtss; the game calls MSL sqrtf (frsqrte + Newton): use the melee_runtime port" },
  { path = "f64::sqrt", reason = "host sqrtsd; the game calls MSL sqrt: use the melee_runtime port" },
  { path = "f32::sin", reason = "host libm; use melee_runtime::lbtrigf / MSL ports" },
  { path = "f32::cos", reason = "host libm; use melee_runtime::lbtrigf / MSL ports" },
  { path = "f32::tan", reason = "host libm; use melee_runtime::lbtrigf / MSL ports" },
