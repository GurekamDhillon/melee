[package]
name = "melee_engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Consolidation plan 1.1: the host side the C gets from the OS and the dolphin SDK (heap arenas, DVD, archive
# images). Game logic stays in the leaf crates' tu/ modules; this crate holds seams only.
[dependencies]
melee_core.workspace = true
melee_types.workspace = true
melee_runtime.workspace = true
melee_link.workspace = true
melee_modes.workspace = true
melee_platform = { path = "../melee_platform" }
melee_gx = { path = "../melee_gx" }
melee_world.workspace = true
melee_fighter.workspace = true
melee_chara.workspace = true
melee_items.workspace = true
melee_data = { path = "../melee_data" }
melee_modhost = { path = "../melee_modhost" }
melee_script = { path = "../melee_script" }
# a define's own sound clips play through the native clip slots (geno_host slice 6); the device feature comes from `melee`
melee_audio = { path = "../melee_audio", default-features = false }

[features]
guard = []
