[package]
name = "melee_corev1"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The engine as a core v1 game library (mu_core_v1.h): melee's own sources with feature corev1 (docs/rust-port/notes/core-v1.md)"
build = "../melee/build.rs"

[lib]
name = "melee_game"
path = "../melee/src/main.rs"
crate-type = ["cdylib"]

[features]
default = ["corev1"]
corev1 = ["melee_engine/corev1", "melee_gx/corev1", "melee_platform/corev1"]
calltrace = ["melee_core/calltrace"]
disc = ["melee_core/disc"]

[dependencies]
melee_core.workspace = true
melee_types.workspace = true
melee_runtime.workspace = true
melee_world.workspace = true
melee_fighter.workspace = true
melee_chara.workspace = true
melee_items.workspace = true
melee_modes.workspace = true
melee_engine.workspace = true
melee_modhost = { path = "../melee_modhost" }
melee_link.workspace = true
# Platform: the sound stack the fighter code's sfx hooks call (`golden --audio`); no device here.
melee_audio = { path = "../melee_audio" }
# view-golden: the HSD draw path on the GX shim, in a window.
melee_gx = { path = "../melee_gx" }
melee_platform = { path = "../melee_platform" }
melee_net = { path = "../melee_net" }
# Saves, settings, mods and replays: the .slp / .gdlp player (`golden --slp`).
melee_data = { path = "../melee_data" }
# m-ex fighters: the PPC interpreter + GC->native field rewrite for gdmod ftFunction code.
mex_import = { path = "../../tools/mex-import" }
winit = "0.30"
font8x8 = "0.3.1"
# cosmetics imports: ZIP members (deflate) and portrait / stock icon PNGs
miniz_oxide = "0.8"
png = "0.18"
