[package]
name = "melee_platform"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Platform layer: window + 60 Hz main loop (winit), PAD input (gilrs, GameCube adapter, keyboard), headless mode"

[features]
# core v1 (melee_corev1): pads from the host (pad_read.rs HOST_PADS)
corev1 = []

[dependencies]
melee_types.workspace = true
melee_core.workspace = true
melee_gx = { path = "../melee_gx" }
wgpu = "27"
png = "0.18"
font8x8 = "0.3.1"
winit = "0.30"
gilrs = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
# usbfs ioctls for the GameCube adapter (adapter/linux_usb.rs)
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# DXGI frame statistics of wgpu's own D3D12 swapchain (VRR detection, gfx.rs); the version wgpu-hal 27 uses
windows = { version = "0.58", default-features = false, features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Foundation", "Win32_System_Performance"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Usb",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Security",
] }
