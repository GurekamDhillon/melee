# Envoy run presentation (gd-ui-v1 presentation mod): built by tools/rust-port/modhost/build_mods.sh.
[package]
name = "envoy_ui"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
gd_ui_enc = { path = "../gd_ui_enc" }

[profile.release]
opt-level = "s"
panic = "abort"
lto = true

