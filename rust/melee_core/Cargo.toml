[package]
name = "melee_core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]

[features]
# Per-call tracing (ct.rs, tools/rust-port/trace/insert_ct.py). Off in normal builds.
calltrace = []
# Discrimination bits at the fp/int helper call sites (disc.rs): the covtest build only (notes/coverage-testing.md).
disc = []

[lints.rust]
# workspace.lints is not inherited where a crate has its own table (rust/Cargo.toml: function identity)
unpredictable_function_pointer_comparisons = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fptrace)'] }
