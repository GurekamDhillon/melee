# Vanilla-parity replays for pc/geno/tools/parity.sh (Stage 0 of the Lab plan).
#
# Each replay is a real console game (Slippi Dolphin, vanilla v1.02 disc, Slippi online 3.19.0,
# vanilla fighters only). Online replays were chosen because the console itself forced the RNG seed
# every frame (Frame Start records it), so the seed is checked, not resynced, and a CPU-free 1v1 is
# fully determined by the recorded inputs. Short games (900-1500 frames) keep a run near half a
# minute; the six cover six different stages and seven different fighters.
#
# The files are GD's own Slippi replays and are not in the repo. A missing file is skipped (and
# reported); `iso=` is the disc they were played on. Override the whole file with PARITY_CONF=<path>.
#
# key=value lines; "#" starts a comment.
