[package]
name = "melee_gx"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "GX on wgpu: GX API + FIFO decode (port of Aurora's GX), TEV -> WGSL, GC texture decode, offscreen renderer"

[dependencies]
melee_core.workspace = true
wgpu = "27"
pollster = "0.4"
bytemuck = "1"
rustc-hash = "2.1"
ab_glyph = { version = "0.2.32", default-features = false, features = ["std"] }

[features]
# Core v1 (mu_core_v1.h): FIFO transcoder for a console-GX host (src/corev1.rs); only melee_corev1 enables it
corev1 = []

[dev-dependencies]
png = "0.18"
