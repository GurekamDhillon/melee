# Example wasm code mod (mod-c-v1): built by tools/rust-port/modhost/build_mods.sh for wasm32-unknown-unknown.
# Not a member of the engine workspace.
[package]
name = "hello_mod"
version = "0.1.0"
edition = "2021"
license = "CC0-1.0"
publish = false

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
panic = "abort"
lto = true

[workspace]
