[package]
name = "melee_modhost"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The WebAssembly mod host (mod-c-v1, docs/rust-port/notes/modhost.md): sandboxed wasm code mods behind hooks-v1 rows.
[dependencies]
melee_core.workspace = true
melee_types.workspace = true
melee_runtime.workspace = true
melee_fighter.workspace = true
melee_modes.workspace = true
melee_world.workspace = true
melee_gx.workspace = true
# Brawl music / sfx from the player's disc (gd_brawl_*: presentation, never sim state)
melee_audio = { path = "../melee_audio", default-features = false }
png = "0.18"
# gd_ui_layout (ui/layout.rs): flexbox layout for the presentation mods, computed natively
taffy = { version = "=0.15.0", default-features = false, features = ["std", "flexbox", "taffy_tree"] }
wasmi = { version = "2.0.0", default-features = false, features = ["std", "validate", "deterministic"] }

[dev-dependencies]
wat = "1"
