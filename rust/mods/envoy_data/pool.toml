# The Envoy drive pool as data (envoy-core-v2.md 4): pool.toml -> build.rs (envoy_lint) -> pool_gen.rs, a no_std
# library used by envoy_sim and envoy_ui. This is the V1 slice: 9 drives and 3 keystones ("S" in the note).
#
# A drive: one rule, one charge source, one effect, one number; it orbits its fighter and fires when its charge is
# full. A second copy levels it up (1 -> 3; the number x1.0 / x1.6 / x2.4).
#   family  RED | GREEN | BLUE | YELLOW | PURPLE | WHITE   (the model body; see src/codes.rs)
#   charge  hit | taken | landing | jump | time | tag_in    (one source)
#   need    how many of them (time: milliseconds)
#   effect  one of src/codes.rs EFFECTS
#   number  x1000: a percent (6000 = 6%) or a time (4000 = 4 s)
#   gives / reads  0-1 word each from Burning, Chilled, Marked, Haste; the word is written in the rule
#   sound   the presentation's sound key (envoy_ui maps it to a Brawl sound); never read by the sim
# A keystone: one rule and one price (one of the seven, or own); belongs to the player.
#
# Numbers are first guesses for the playtest (Q5: start loud).

# ---- RED: damage
