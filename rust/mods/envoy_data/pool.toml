# The Envoy drive pool as data: pool.toml -> build.rs (envoy_lint) -> pool_gen.rs, a no_std library used by
# envoy_sim and envoy_ui. V3 (Heat, envoy-synergy-v3.md 12.6-12.7): the slice's 16 drives plus V2's other ten
# re-derived on damage (26), and 7 keystones (the slice's three and V2's other four).
#
# A drive: one rule and one number; it orbits its fighter in slot order (the first slot leads).
#   kind      trigger | shaper | heat_add | gain_mul | heat_mul | neighbour (src/codes.rs ROLES)
#   tier      common | rare | epic
#   family    RED | GREEN | BLUE | YELLOW | PURPLE | WHITE
#   charge    (triggers only) dealt | aerial_dealt | chilled_dealt | offstage_dealt | taken | time | tag_in | shift | cashout
#   need      percent x1000 (40000 = every 40%), or milliseconds for `time`; none for tag_in / shift / cashout
#   coef      x1000: how much of a fire's damage charges the drives to its right (4.1); 1000 only with launch
#   launch    true: the fire is a blast that launches (a timed drive only)
#   when      the condition of a heat_add / gain_mul drive, or a cashout trigger's filter (src/codes.rs WHENS)
#   effect    one of src/codes.rs EFFECTS
#   number    x1000: a percent, a time (ms), a Heat amount or a multiplier (gain_mul: 1500 = x1.5)
#   gives / reads, look, sound   as V2
#
# Numbers: the spec's first guesses (12.6), tuned toward loud where a drive read weak (docs/rust-port/notes/
# envoy-v3-rules.md lists every change): fires +25-50%, coefficients lowered to keep the 4.3 bound.
