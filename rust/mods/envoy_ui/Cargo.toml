# Envoy run presentation (gd-ui-v1 presentation mod): built by tools/rust-port/modhost/build_mods.sh.
[package]
name = "envoy_ui"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
gd_ui_enc = { path = "../gd_ui_enc" }
envoy_data = { path = "../envoy_data" }
# layout (src/ly.rs): flexbox only, no_std + alloc (the mod's allocator is a per-frame bump arena)
taffy = { version = "=0.15.0", default-features = false, features = ["alloc", "flexbox", "taffy_tree"] }

[profile.release]
opt-level = "s"
panic = "abort"
lto = true

# the layout pass runs every frame a panel is up: full optimisation for it (the mod itself is built for size)
[profile.release.package.taffy]
opt-level = 3

[workspace]
