[package]
name = "melee_core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]

[features]
# Per-call tracing (ct.rs, tools/rust-port/trace/insert_ct.py). Off in normal builds.
calltrace = []
# Discrimination bits at the fp/int helper call sites (disc.rs): the covtest build only (notes/coverage-testing.md).
disc = []
# Union-drift checker (mvshadow.rs, tools/rust-port/mvshadow/instrument.py): an instrumented scratch build only.
mvshadow = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fptrace)'] }
