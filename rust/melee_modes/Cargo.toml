[package]
build = "build.rs"
name = "melee_modes"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
melee_fptrace.workspace = true
melee_core.workspace = true
melee_types.workspace = true
melee_runtime.workspace = true
melee_world.workspace = true
melee_fighter.workspace = true
melee_chara.workspace = true
melee_items.workspace = true
melee_data = { path = "../melee_data" }
brawl_boss = { path = "../brawl_boss" }

[features]
# links the C state oracle (oracle/tou/gen.py -> target/tou-oracle/tou_oracle.lib) into tests/tou
c_oracle = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fptrace)'] }

[dev-dependencies]
# the C-oracle harnesses name fn pointers by symbol (melee_core/test_support/fnsym.rs)
backtrace = "0.3"
