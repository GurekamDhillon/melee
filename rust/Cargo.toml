# Native Rust port of GD's Melee. See ../RUST_PORT.md and ../docs/rust-port/inventory.md.
# One crate per port group (docs/rust-port/inventory.md "Port groups"); the groups are an order of
# work, headers are cyclic in C, so later crates depend on earlier ones, never the reverse.
#   melee_types    group 0  every struct/enum/const + GameCube layout table
#   melee_runtime  group 1  MSL math, gekko fp, mtx, HSD (sysdolphin baselib), lb, db, sfx
#   melee_world    group 2  mp, cm, ef, gr, if
#   melee_fighter  group 3  ft engine, ftCommon, pl
#   melee_chara    group 4  ft/chara/* (characters)
#   melee_items    group 5  it, ty, vi
#   melee_modes    group 6  gm, mn, port game-side (script_game, geno, mex_tests)
# Raw c2rust output lives in <crate>/src/raw/ and is NOT compiled (tools/rust-port/transpile.sh).
[workspace]
resolver = "2"
members = ["melee_core", "melee_types", "melee_runtime", "melee_world", "melee_fighter",
           "melee_chara", "melee_items", "melee_modes", "melee_platform", "melee_gx", "melee_audio", "melee_net", "melee_data", "melee_script", "melee_link", "melee_engine", "melee_modhost", "melee",
           "../tools/mex-import"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "CC0-1.0"
publish = false

[workspace.dependencies]
melee_core = { path = "melee_core" }
melee_types = { path = "melee_types" }
melee_runtime = { path = "melee_runtime" }
melee_world = { path = "melee_world" }
melee_fighter = { path = "melee_fighter" }
melee_chara = { path = "melee_chara" }
melee_items = { path = "melee_items" }
melee_modes = { path = "melee_modes" }
melee_link = { path = "melee_link" }
melee_engine = { path = "melee_engine" }

# Determinism: game logic must match the C build bit for bit. Rust never contracts a*b+c on its
# own, but the C build DOES (clang -ffp-contract=on + gwtool -> melee_core::fp::fmadds), so ports
# write each fused site out explicitly (RUST_PORT.md "Float contraction"). Overflow wraps like -fwrapv.
[profile.dev]
overflow-checks = false
[profile.release]
overflow-checks = false
debug = 1

# `cargo build -p melee --profile fast` (tools/rust-port/cargo_fast.sh, PROFILE=fast for gate.sh and the golden scripts): the
# agents' edit-build-test loop. Same opt-level and overflow-checks as release (so the same floating-point code: Rust never
# contracts, fmadds sites are explicit), but incremental, 256 codegen units, no LTO, no debuginfo. Output equal to release
# on the goldens/synctest/audio/coverage (notes/fastbuild.md). Release is unchanged.
[profile.fast]
inherits = "release"
incremental = true
codegen-units = 256
lto = false
debug = 0

# `cargo build -p melee --profile perf`: fat LTO, one codegen unit. About 25% faster ticks than release, 2.3x the build time
# (9 min vs 4); output bit-identical (notes/perf.md). Release stays as it was so everyday builds stay fast.
[profile.perf]
inherits = "release"
lto = "fat"
codegen-units = 1

# The C build embeds the vendored Lua 5.4.7 (pc/third_party/lua-5.4.7, unmodified). lua-src ships 5.4.9, so
# the crate is patched to compile those exact sources: the scripting host runs the same Lua as the C build.
[patch.crates-io]
lua-src = { path = "third_party/lua-src" }
