[package]
name = "melee_net"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Platform layer: rollback netplay transport (port of pc/platform/gw_net.c: UDP, handshake, input exchange, time sync, checksums) + the rollback session/driver interface"

[dependencies]
# Tracy zones only (melee_core::tracy; empty without the `profile-tracy` feature)
melee_core.workspace = true

[dev-dependencies]
# the in-process SyncTest / session tests run the ported game code (tests/session.rs)
melee_types.workspace = true
melee_fighter.workspace = true
melee_runtime.workspace = true

[features]
# `slippi_mm` against Slippi's real matchmaking server (wss://, `--mm-real`): TLS. Off by default; the default build
# only talks to a local mock on loopback.
real-net = ["dep:rustls", "dep:webpki-roots", "mu-net"]
# mu_net (P2P Direct, src/mu_net): Ed25519 / X25519 / ChaCha20-Poly1305 from ring, which rustls already brings in.
mu-net = ["dep:ring"]

[dependencies.rustls]
version = "0.23"
optional = true
default-features = false
features = ["ring", "std", "tls12", "logging"]

[dependencies.ring]
version = "0.17"
optional = true

[dependencies.webpki-roots]
version = "1"
optional = true

[lints]
workspace = true
