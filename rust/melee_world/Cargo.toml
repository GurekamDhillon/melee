[package]
name = "melee_world"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
melee_fptrace.workspace = true
melee_core.workspace = true
melee_types.workspace = true
melee_runtime.workspace = true

[lints.rust]
# workspace.lints is not inherited where a crate has its own table (rust/Cargo.toml: function identity)
unpredictable_function_pointer_comparisons = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fptrace)'] }

[dev-dependencies]
# the C-oracle harnesses name fn pointers by symbol (melee_core/test_support/fnsym.rs)
backtrace = "0.3"
