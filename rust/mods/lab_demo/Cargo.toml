# Example gd-lab-v1 mod: savestates, rewind, record and playback, and the frame meter feed, drawn with gd-ui-v1.
# Built by tools/rust-port/modhost/build_mods.sh for wasm32-unknown-unknown.
[package]
name = "lab_demo"
version = "0.1.0"
edition = "2021"
license = "CC0-1.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
gd_ui_enc = { path = "../gd_ui_enc" }

[profile.release]
opt-level = "s"
panic = "abort"
lto = true

[workspace]
