# Native Rust port of GD's Melee. See ../RUST_PORT.md and ../docs/rust-port/inventory.md.
# One crate per port group (docs/rust-port/inventory.md "Port groups"); the groups are an order of
# work, headers are cyclic in C, so later crates depend on earlier ones, never the reverse.
#   melee_types    group 0  every struct/enum/const + GameCube layout table
#   melee_runtime  group 1  MSL math, gekko fp, mtx, HSD (sysdolphin baselib), lb, db, sfx
#   melee_world    group 2  mp, cm, ef, gr, if
#   melee_fighter  group 3  ft engine, ftCommon, pl
#   melee_chara    group 4  ft/chara/* (characters)
#   melee_items    group 5  it, ty, vi
#   melee_modes    group 6  gm, mn, port game-side (script_game, geno, mex_tests)
# Raw c2rust output lives in <crate>/src/raw/ and is NOT compiled (tools/rust-port/transpile.sh).
[workspace]
resolver = "2"
members = ["melee_core", "melee_types", "melee_runtime", "melee_world", "melee_fighter",
           "melee_chara", "melee_items", "melee_modes", "melee_platform", "melee_gx", "melee_audio", "melee_net", "melee_data", "melee",
           "../tools/mex-import"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "CC0-1.0"
publish = false

[workspace.dependencies]
melee_core = { path = "melee_core" }
melee_types = { path = "melee_types" }
melee_runtime = { path = "melee_runtime" }
melee_world = { path = "melee_world" }
melee_fighter = { path = "melee_fighter" }
melee_chara = { path = "melee_chara" }
melee_items = { path = "melee_items" }
melee_modes = { path = "melee_modes" }

# Determinism: game logic must match the C build bit for bit. Rust never contracts a*b+c on its
# own, but the C build DOES (clang -ffp-contract=on + gwtool -> melee_core::fp::fmadds), so ports
# write each fused site out explicitly (RUST_PORT.md "Float contraction"). Overflow wraps like -fwrapv.
[profile.dev]
overflow-checks = false
[profile.release]
overflow-checks = false
debug = 1
