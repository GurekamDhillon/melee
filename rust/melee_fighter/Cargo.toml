[package]
name = "melee_fighter"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
melee_core.workspace = true
melee_types.workspace = true
# melee_runtime.workspace = true
# melee_world.workspace = true
c2rust-bitfields = { version = "=0.22.1", optional = true }

[features]
# Compile the mechanical c2rust translation of every group-3 TU (src/c2r, ~1.5M lines, ~3 min).
# src/c2r is generated and gitignored: run tools/rust-port/transpile.sh on the group, then
# `python rust/melee_fighter/gen/fix_raw.py` (docs/rust-port/group-3 fighter engine + common states.md).
c2r = ["dep:c2rust-bitfields"]
