# The Envoy crest pool (envoy-redesign.md section 2, full-game-plan.md 4.2). Hand-authored; build.rs lints it and
# generates pool_gen.rs for envoy_sim (rules, numbers, weights, words) and envoy_ui (names, texts, families).
#
# A crest: one rule, one number, worn by one fighter of the pair, firing at a moment.
#   family  ALWAYS | RELAY | BENCH | SHIFT | POOL | OPENER   (HEAVY waits for the bosses, milestone 3)
#   moment  the one trigger (the family fixes which moments are allowed; see src/spec.rs MOMENTS)
#   effect  the one effect (src/spec.rs EFFECTS)
#   number  the one number (x1000): the thing a hone changes (+50%, once; milestone 2)
#   weight  1-3, the foe budget unit (never shown)
#   gives / reads  0-1 word each from Fresh, Benched, Marked, Burning; the word is written in the rule
#
# Numbers are first guesses for a playtest; the harness (milestone 2) tunes them.

# ---- ALWAYS: no moment, on while the wearer is in
[[crest]]
key = "power"
name = "Power"
family = "ALWAYS"
moment = "always"
effect = "attack"
number = 200
weight = 1
rule = "This fighter's hits deal +20%."

