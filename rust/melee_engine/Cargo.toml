[package]
name = "melee_engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Consolidation plan 1.1: the host side the C gets from the OS and the dolphin SDK (heap arenas, DVD, archive
# images). Game logic stays in the leaf crates' tu/ modules; this crate holds seams only.
[dependencies]
backtrace = "0.3"
melee_core.workspace = true
melee_types.workspace = true
melee_runtime.workspace = true
melee_link.workspace = true
melee_modes.workspace = true
melee_platform = { path = "../melee_platform" }
melee_gx = { path = "../melee_gx" }
melee_world.workspace = true
melee_fighter.workspace = true
melee_chara.workspace = true
melee_items.workspace = true
melee_data = { path = "../melee_data" }
melee_modhost = { path = "../melee_modhost" }
# geno 12 fighter modules (geno_wasm): the mod host's runtime, its deterministic NaN handling
wasmi = { version = "2.0.0", default-features = false, features = ["std", "validate", "deterministic"] }
melee_script = { path = "../melee_script" }
# m-ex fighters' ftFunction PPC code (mex_guest): the interpreter and the field rewriting
mex_import = { path = "../../tools/mex-import" }
# a define's own sound clips play through the native clip slots (geno_host slice 6); the device feature comes from `melee`
melee_audio = { path = "../melee_audio", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# core v1 (melee_corev1): the disc read through the host (gcm.rs HOST_READ) and the GX transcoder
corev1 = ["melee_gx/corev1"]
guard = []
# builds the layout walker example only (it includes a generated table, see tools/rust-port/layout)
layout-walk = []

# tools/rust-port/layout: the disc-wide field walker (needs LAYOUT_WALK_TABLE, see tools/rust-port/layout/run_walk.sh)
[[example]]
name = "layout_walk"
path = "../../tools/rust-port/layout/walk.rs"
required-features = ["layout-walk"]
